name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL != '' && vars.VITE_RPC_URL || 'https://api.devnet.solana.com' }}
          VITE_TOKEN_PROGRAM_ID: ${{ vars.VITE_TOKEN_PROGRAM_ID != '' && vars.VITE_TOKEN_PROGRAM_ID || '3Eoy49pVjDBm4KArrTERpotuZmaAnouj5TyALW2ALcAw' }}
          VITE_FAUCET_PROGRAM_ID: ${{ vars.VITE_FAUCET_PROGRAM_ID != '' && vars.VITE_FAUCET_PROGRAM_ID || '28jX1tPZKkahfcV4VJCG7GVJZdowSMXn168ihanac9cn' }}
          VITE_BURNER_PROGRAM_ID: ${{ vars.VITE_BURNER_PROGRAM_ID != '' && vars.VITE_BURNER_PROGRAM_ID || 'D7R4JgGKkB2wsDBnpnMEyiRr2RKbCZfMyuRqKfqyMWGR' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
